{% load static %}
{% load humanize %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <section class="vh-100">
    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col">
          <div class="card" id="list1" style="border-radius: .75rem; background-color: #eff1f2;">
            <div class="card-body py-4 px-4 px-md-5">

              <p class="h1 text-center mt-3 mb-4 pb-3 text-primary">
                <i class="fas fa-check-square me-1"></i>
                <u>Todo List</u>
              </p>
              <div class="user-info">
                  <h6>welcome, {{ user.username }} |</h6>

                  <form method="post" action="{% url 'logout' %}">
                      {% csrf_token %}
                      <button type="submit" class="logout-btn">Logout</button>
                  </form>
              </div>
              <div class="pb-2">
                <div class="card">
                  <div class="card-body">
                    <form method="post" action="{% url 'task-create' %}">{% csrf_token %}
                      <div class="d-flex flex-row align-items-center">
                        <input type="text" name="title" class="form-control form-control-lg" id="exampleFormControlInput1"
                          placeholder="Add new...">
                        <div>
                          <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary">Add</button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>

              <hr class="my-4">

              <div class="d-flex justify-content-end align-items-center mb-4 pt-2 pb-3">
                <p class="small mb-0 me-2 text-muted">Filter</p>
                <select data-mdb-select-init id="task-filter">
                  <option value="/">All</option>
                  <option value="/?status=completed">Completed</option>
                  <option value="/?status=active">Active</option>
                </select>
                <script>
                  document.addEventListener('DOMContentLoaded', function () {

                    const select = document.getElementById('task-filter');

                    select.addEventListener('change', function () {
                        window.location.href = this.value;
                  });

                  const status = new URLSearchParams(window.location.search).get('status');

                    if (status === 'completed') {
                        select.value = '/?status=completed';
                    } 
                    else if (status === 'active') {
                        select.value = '/?status=active';
                    } 
                    else {
                        select.value = '/';
                  }

                    // Update MDB Select UI
                  const instance = mdb.Select.getInstance(select);

                    if (instance) {
                        instance.setValue(select.value);
                    }
                  });
                </script>
              </div>

              {% for object in object_list %}
                <ul class="list-group list-group-horizontal rounded-0 bg-transparent task-item">
                  <li
                    class="list-group-item d-flex align-items-center ps-0 pe-3 py-1 rounded-0 border-0 bg-transparent">
                    <div class="form-check">
                      <form method="post" action="{% url 'task-status' object.id %}">{% csrf_token %}
                        <input class="form-check-input me-0" type="checkbox" value="" id="flexCheckChecked1" onchange="this.form.submit()"
                          aria-label="..." {% if object.status %}checked{% endif %} />
                      </form>
                  </div>
                  </li>
                  <li
                    class="list-group-item px-3 py-1 d-flex align-items-center flex-grow-1 border-0 bg-transparent">
                    <p class="lead fw-normal mb-0 {% if object.status %}completed{% endif %}">{{object.title}}</p>
                  </li>
                  <li class="list-group-item ps-3 pe-0 py-1 rounded-0 border-0 bg-transparent">
                    <div class="d-flex flex-row justify-content-end mb-1">
                      <a href="{% url 'task-update' object.pk %}" class="" data-mdb-tooltip-init title="Edit todo"><i
                          class="fas fa-pencil-alt me-3"></i></a>
                      <a href="{% url 'task-delete' object.pk %}" class="text-danger" data-mdb-tooltip-init title="Delete todo"><i
                          class="fas fa-trash-alt"></i></a>
                    </div>
                    <div class="text-end text-muted">
                      <a href="#!" class="text-muted" data-mdb-tooltip-init title="Updated date | Created date">
                        <p class="small mb-0"><i class="fas fa-info-circle me-2"></i>{{object.updated_at|naturaltime}} | {{object.created_at|naturaltime}}</p>
                      </a>
                    </div>
                  </li>
                </ul>
              {% endfor %}
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
